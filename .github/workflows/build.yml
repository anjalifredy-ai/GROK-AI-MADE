name: Build APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_APK_CHAT_ID: "@ivorisnoob_chat"
  OWNER_URL: "https://ivorisnoob.lol"

jobs:
  authorize:
    name: Authorize run
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      is-fork-pr: ${{ steps.gate.outputs.is-fork-pr }}
    steps:
      - name: Check the actor is the owner or a trusted collaborator
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXTRA_TRUSTED: ${{ vars.TRUSTED_ACTORS }}
        run: |
          set -euo pipefail
          read -r -a TRUSTED <<< "${REPO_OWNER} claude claude[bot] claude-bot claude-code[bot] ${EXTRA_TRUSTED//,/ }"
          actor_is_trusted() {
            local candidate
            for candidate in "${TRUSTED[@]}"; do
              if [ "${candidate,,}" = "${ACTOR,,}" ]; then
                return 0
              fi
            done
            return 1
          }
          allowed=false
          is_fork_pr=false
          reason=""
          case "${EVENT_NAME}" in
            pull_request)
              if [ "${PR_HEAD_REPO}" = "${REPO}" ]; then
                allowed=true
                reason="same-repo pull request"
              else
                is_fork_pr=true
                case "${PR_ASSOCIATION}" in
                  OWNER|MEMBER|COLLABORATOR)
                    allowed=true
                    reason="fork pull request from ${PR_ASSOCIATION}"
                    ;;
                  *)
                    reason="fork pull request from ${PR_ASSOCIATION:-NONE}"
                    ;;
                esac
              fi
              ;;
            push|workflow_dispatch)
              if actor_is_trusted; then
                allowed=true
                reason="${EVENT_NAME} by trusted actor"
              else
                reason="${EVENT_NAME} by untrusted actor"
              fi
              ;;
            *)
              reason="unhandled event ${EVENT_NAME}"
              ;;
          esac
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"
          echo "is-fork-pr=${is_fork_pr}" >> "$GITHUB_OUTPUT"
          if [ "${allowed}" = "true" ]; then
            echo "Authorized: ${ACTOR} (${reason})." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Build skipped"
              echo ""
              echo "\`${ACTOR}\` is not the repository owner or a collaborator (${reason})."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-debug:
    name: Build Debug APK
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Upload Debug APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-universal
        path: app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-arm64-v8a
        path: app/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-armeabi-v7a
        path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  build-release:
    name: Build Release APK
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && needs.authorize.outputs.is-fork-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Prepare keystore (skip corrupt upstream secrets)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p keystore
        # Upstream Koda secrets are not available / corrupt on this personal fork.
        # Leaving no keystore file makes app/build.gradle.kts fall back to debug signing.
        rm -f keystore/ivormusic.jks
        if [ -n "${KEYSTORE_BASE64:-}" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/ivormusic.jks 2>/dev/null || true
          # Validate: must be a readable JKS/PKCS12; otherwise drop it.
          if ! keytool -list -keystore keystore/ivormusic.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "Keystore invalid or password mismatch — using debug signing for release."
            rm -f keystore/ivormusic.jks
          fi
        else
          echo "No KEYSTORE_BASE64 secret — using debug signing for release."
        fi
    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease
    - name: Upload Release APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal
        path: app/build/outputs/apk/release/*universal*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-armeabi-v7a
        path: app/build/outputs/apk/release/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload Release mapping.txt
      uses: actions/upload-artifact@v4
      with:
        name: app-release-mapping
        path: app/build/outputs/mapping/release/mapping.txt
        if-no-files-found: warn
        retention-days: 90
